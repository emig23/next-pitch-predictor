name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:                       
        image: postgres:16
        env:
          POSTGRES_USER: pitch
          POSTGRES_PASSWORD: ci-only-password   
          POSTGRES_DB: pitch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pitch -d pitch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://pitch:ci-only-password@localhost:5432/pitch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t pitch-api .
      - name: Start the container and call it
        run: |
          docker run -d --name api -p 8000:8000 pitch-api
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break || sleep 2; done
          curl -sf http://localhost:8000/health | grep '"model_loaded":true'
          curl -sf -X POST http://localhost:8000/predict -H 'content-type: application/json' -d '{"pitcher_id":592332,"pitcher_throws":"R","batter_id":660271,"batter_stands":"L","at_bat_number":1,"pitch_number":1,"inning":1,"inning_half":"Bot","balls":0,"strikes":0,"outs":0,"pitching_team_score":0,"batting_team_score":0}' | grep '"top_pick"'
      - name: Show the container log if something failed
        if: failure()
        run: docker logs api